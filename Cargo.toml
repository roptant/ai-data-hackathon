[workspace]
members = [
    "crates/dictation-core",
    "crates/dictation-storage",
    "crates/dictation-worker",
    "crates/dictation-platform",
    "workers/asr",
    "workers/privacy",
    "crates/dictation-bench",
    "crates/dictation-models",
    "crates/dictation-engine",
    "crates/dictation-protocol",
    "crates/dictation-server",
    "crates/dictation-api",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
