[package]
name = "dictation-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Encrypted local storage and retention for Local Dictation"

[dependencies]
dictation-core = { path = "../dictation-core" }
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
zeroize = "1"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
