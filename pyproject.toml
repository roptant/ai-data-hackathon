[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dictation"
version = "0.1.0"
description = "Local dictation with privacy-filtered personalization (reference implementation)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "keyring>=24",
]

[project.optional-dependencies]
upload = ["requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
dictation = "dictation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
