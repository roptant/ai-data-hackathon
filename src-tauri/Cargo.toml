[package]
name = "local-dictation-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri desktop shell for Local Dictation"

[lib]
name = "local_dictation_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dictation-core = { path = "../crates/dictation-core" }
dictation-platform = { path = "../crates/dictation-platform" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[lints]
workspace = true
